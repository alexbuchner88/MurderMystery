<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alpha Centauri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E1A; --panel:#141928; --panel2:#1B2136; --border:#3A4258;
  --amber:#FFA94D; --blue:#5AC8E8; --text:#E8E6E0; --dim:#8A91A8; --danger:#E8615A;
  --ok:#6FCF97;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:700; margin:0 0 8px;}
.mono{font-family:'JetBrains Mono',monospace;}
.topbar{
  position:sticky; top:0; z-index:10;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  background:linear-gradient(var(--bg),var(--bg) 85%,transparent);
  border-bottom:1px solid var(--border);
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.title{font-size:1.05rem; letter-spacing:0.3px;}
.phase-chip{font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--amber); border:1px solid var(--amber); padding:4px 10px; white-space:nowrap;}
.btn{
  font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:0.9rem;
  background:var(--amber); color:#1A1200; border:none; padding:10px 16px;
  cursor:pointer;
}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:transparent; color:var(--blue); border:1px solid var(--blue);}
.btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
.btn:disabled{opacity:0.35; cursor:not-allowed;}
.tabs{display:flex; gap:4px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
.tab{
  font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--dim);
  background:var(--panel); border:1px solid var(--border); padding:8px 12px;
  cursor:pointer; white-space:nowrap;
}
.tab.active{color:var(--bg); background:var(--blue); border-color:var(--blue);}
main{max-width:640px; margin:0 auto; padding:16px 16px 60px;}
.panel{background:var(--panel); border:1px solid var(--border); padding:16px; margin-bottom:14px;}
.panel h3{font-size:0.95rem; color:var(--amber);}
.eyebrow{font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--dim); margin-bottom:4px;}
.subject-card{
  background:var(--panel2); border:1px solid var(--border); padding:12px; margin-bottom:10px;
  display:flex; gap:12px; align-items:flex-start;
}
.avatar{
  width:44px; height:44px; min-width:44px; border-radius:50%;
  background:var(--panel); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--blue); font-size:1rem;
}
.subject-body{flex:1; min-width:0;}
.subject-name{font-weight:700; margin-bottom:2px;}
.subject-role{font-size:0.8rem; color:var(--dim); margin-bottom:8px;}
.flags{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.flag{display:flex; align-items:center; gap:6px; font-size:0.8rem; cursor:pointer; user-select:none;}
.flag input{width:16px; height:16px; accent-color:var(--amber);}
select, textarea, input[type=text]{
  width:100%; background:var(--panel); color:var(--text); border:1px solid var(--border);
  padding:8px; font-family:'Space Grotesk',sans-serif; font-size:0.85rem; margin-top:4px;
}
textarea{min-height:60px; resize:vertical;}
.row-label{font-size:0.75rem; color:var(--dim); margin-top:8px; display:block;}
.notes-toggle{font-size:0.78rem; color:var(--blue); background:none; border:none; cursor:pointer; padding:4px 0; text-decoration:underline;}
.banner{
  border-left:3px solid var(--amber); padding:10px 12px; background:var(--panel2);
  font-size:0.88rem; margin-bottom:14px; line-height:1.5;
}
.empty{color:var(--dim); font-size:0.88rem; text-align:center; padding:30px 10px;}
.reveal{animation:flicker 0.5s ease-out;}
@keyframes flicker{
  0%{opacity:0.2;} 15%{opacity:0.8;} 30%{opacity:0.15;} 50%{opacity:1;} 100%{opacity:1;}
}
.pick-grid{display:grid; gap:8px;}
.pick-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--panel2); border:1px solid var(--border); padding:10px 12px;
}
.pick-actions{display:flex; gap:6px;}
.pick-btn{
  font-family:'JetBrains Mono',monospace; font-size:0.72rem; padding:6px 10px;
  background:transparent; border:1px solid var(--border); color:var(--dim); cursor:pointer;
}
.pick-btn.on-suspect{background:var(--danger); border-color:var(--danger); color:#1A0505;}
.pick-btn.on-innocent{background:var(--ok); border-color:var(--ok); color:#062412;}
.board-card{background:var(--panel2); border:1px solid var(--border); padding:10px; margin-bottom:8px;}
.board-header{display:flex; align-items:center; gap:8px; cursor:pointer;}
.avatar-wrap{position:relative;}
.avatar-wrap .avatar{width:38px; height:38px; min-width:38px; font-size:0.85rem;}
.avatar.avatar-suspect{border:2px solid var(--danger);}
.avatar.avatar-innocent{border:2px solid var(--ok);}
.badge{
  position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:50%;
  background:var(--bg); border:1px solid var(--border); font-size:0.62rem; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.badge.badge-suspect{color:var(--danger); border-color:var(--danger);}
.badge.badge-innocent{color:var(--ok); border-color:var(--ok);}
.board-header .subject-name{margin-bottom:0;}
.board-header .subject-role{margin-bottom:0;}
.chevron{color:var(--dim); font-size:0.8rem; padding-left:6px;}
.board-body{margin-top:8px; padding-left:0;}
.flags.tight{gap:6px; margin-bottom:6px; flex-wrap:nowrap;}
.tristate{
  font-family:'JetBrains Mono',monospace; font-size:0.68rem; padding:5px 6px; flex:1;
  background:transparent; border:1px solid var(--border); color:var(--dim); cursor:pointer; text-align:center;
}
.tristate.ts-yes{border-color:var(--danger); color:var(--danger);}
.tristate.ts-no{border-color:var(--ok); color:var(--ok);}
.setup-note{font-size:0.78rem; color:var(--dim); border:1px dashed var(--border); padding:10px; margin-top:10px;}
.avatar{overflow:hidden;}
button.avatar{padding:0;cursor:pointer;}
.board-header .pick-btn{flex:none;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
::-webkit-scrollbar{height:6px; width:6px;}
::-webkit-scrollbar-thumb{background:var(--border);}
@media (max-width:400px){ .title{font-size:0.95rem;} }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-row">
        <div class="phase-chip mono" id="phaseChip">PHASE 1/6</div><div id="meSlot"></div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBXngpFJJQaQ31XvyVZQ1gvXYbsoXnVJ58",
  authDomain: "example-app-6ecf5.firebaseapp.com",
  projectId: "example-app-6ecf5",
  storageBucket: "example-app-6ecf5.firebasestorage.app",
  messagingSenderId: "499648887891",
  appId: "1:499648887891:web:1c75271271df39f5b81aa6"
};
const PHASE_INFO = [
  {title:"ARRIVAL", banner:"Welcome to Alpha Centauri. Check the guest list to see who is here tonight."},
  {title:"THE MURDER", banner:"A body has been found. Two rumours are now circulating from each guest: one accusing, one exonerating. Trade them with the room."},
  {title:"THE WEAPON", banner:"The murder weapon has been identified. Each guest holds a clue: one connecting a person to the weapon, one disproving a connection."},
  {title:"TIME & PLACE", banner:"The time and place of the murder are confirmed. Check alibis. Some are proven, some rest only on another guest's word."},
  {title:"THE ACCOMPLICE", banner:"No single guest has motive, ability and opportunity together. Find the PAIR who between them have all three."},
  {title:"THE VERDICT", banner:"Cast your votes. Choose up to two suspects to accuse, or mark guests as certainly innocent."}
];
const OBJ = {2:'motive',3:'ability',4:'opportunity'};
const SECRETS = [
  {min:2, label:"YOUR RUMOURS", f:[["accuse","Accusing"],["exonerate","Exonerating"]]},
  {min:3, label:"YOUR WEAPON CLUES", f:[["weaponConnect","Connects someone"],["weaponDisprove","Disproves a connection"]]},
  {min:4, label:"YOUR ALIBI", f:[["alibi","Alibi"]]}
];
const store = {
  get(k,d){ try{const v=localStorage.getItem('mm_'+k); return v?JSON.parse(v):d;}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem('mm_'+k, JSON.stringify(v));}catch(e){} }
};
const state = { tab:store.get('tab3',0), hide:store.get('hide3',false), hideInfo:store.get('hideinfo3',false), secOpen:store.get('sec3',true), open:store.get('open2',{}), trk:store.get('trk2',{}), rd:store.get('rd2',{}), pn:store.get('pn2',{}) };
function save(){ store.set('tab3',state.tab); store.set('hide3',state.hide); store.set('hideinfo3',state.hideInfo); store.set('sec3',state.secOpen); store.set('open2',state.open); store.set('trk2',state.trk); store.set('rd2',state.rd); store.set('pn2',state.pn); }

let db=null, myUid=null, peers={}, loaded=false, dirty=false, editing=false;
const $ = s=>document.querySelector(s);
const esc = t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl = t=>esc(t).replace(/\n/g,'<br>');
const norm = t=>String(t||'').trim().toLowerCase();
const okImg = p=>typeof p==='string'&&p.startsWith('data:image/jpeg;base64,')&&p.length<60000;
const initials = n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase()||'?';
const av = p=>okImg(p.photo)?`<img src="${p.photo}" alt="">`:esc(initials(p.name));
const P = ()=>Object.keys(peers).filter(k=>k[0]!=='_').map(k=>Object.assign({id:k},peers[k])).sort((a,b)=>(a.created||0)-(b.created||0));
const mine = ()=>P().find(p=>p.owner&&p.owner===myUid);
const phase = ()=>(peers._game&&peers._game.phase)||1;
const isAdmin = m=>norm(m.title)==='admin';
const isSO = m=>isAdmin(m)||norm(m.title)==='security officer';
const newId = ()=>'p'+Math.random().toString(36).slice(2,9)+Date.now().toString(36);

function upd(id,patch){
  const cur = peers[id] = peers[id]||{};
  Object.keys(patch).forEach(k=>{ const v=patch[k]; cur[k] = (v&&typeof v==='object') ? Object.assign({},cur[k],v) : v; });
  if(db) db.doc('players/'+id).set(patch,{merge:true}).catch(()=>{});
}
function blank(extra){ return Object.assign({owner:'',name:'',realName:'',title:'',system:'',abilities:'',photo:'',notes:'',secrets:{},votes:{},created:Date.now()},extra); }
function setPhase(n){ if(n<1||n>6) return; upd('_game',{phase:n}); render(); window.scrollTo(0,0); }
function shrink(file){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onerror=no; r.onload=()=>{ const im=new Image(); im.onerror=no; im.onload=()=>{ const n=128,c=document.createElement('canvas'); c.width=c.height=n; const s=Math.min(im.width,im.height); c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,n,n); ok(c.toDataURL('image/jpeg',0.75)); }; im.src=r.result; }; r.readAsDataURL(file); }); }
const trk = id=>Object.assign({motive:'unknown',ability:'unknown',opportunity:'unknown',shared:''},state.trk[id]);
const nextTri = v=>v==='unknown'?'yes':v==='yes'?'no':'unknown';
const triSym = v=>v==='yes'?'✓':v==='no'?'✕':'–';
const triCls = v=>v==='yes'?'ts-yes':v==='no'?'ts-no':'';

function renderTop(me){
  $('#phaseChip').textContent = `PHASE ${phase()}/6 — ${PHASE_INFO[phase()-1].title}`;
  $('#meSlot').innerHTML = me?`<button class="avatar" id="meBtn" title="My profile" style="width:36px;height:36px;min-width:36px;font-size:${state.tab===3?'1rem':'.8rem'};${state.tab===3?'border-color:var(--amber);':''}">${state.tab===3?'✕':av(me)}</button>`:'';
  const tabs = me&&phase()>=6?['Guests','Accusation','Verdict']:[];
  $('#tabs').innerHTML = tabs.map((t,i)=>`<button class="tab ${state.tab===i?'active':''}" data-tab="${i}" >${t}</button>`).join('');
}
function phaseButtons(){
  const n=phase();
  return `<div style="display:flex;gap:10px;margin-top:14px;"><button class="btn secondary" data-a="prev" ${n<=1?'disabled':''}>← Back</button><button class="btn" data-a="next" ${n>=6?'disabled':''}>${n>=6?'Investigation Closed':'Next Phase →'}</button></div>`;
}
function signup(){
  const free = P().filter(p=>!p.owner);
  return `<div class="panel"><div class="eyebrow">SIGN UP</div><h3>Dear Passengers! Prepare for your arrival on Alpha Centauri and register your person.</h3>
    <label class="row-label">Character name</label><input type="text" id="su_name" maxlength="40">
    <label class="row-label">Your real name</label><input type="text" id="su_real" maxlength="40">
    <button class="btn" data-a="signup" style="margin-top:12px;">Register</button></div>
    ${free.length?`<div class="panel"><div class="eyebrow">OR CLAIM A PROFILE THE HOST CREATED</div>${free.map(p=>`<div class="pick-row" style="margin-bottom:8px;"><div><div class="subject-name">${esc(p.name)}</div><div class="subject-role" style="margin:0;">${esc(p.title)}</div></div><button class="pick-btn" data-a="claim" data-id="${p.id}">This is me</button></div>`).join('')}</div>`:''}`;
}
function guests(me){
  const ps=P().sort((a,b)=>(b.id===me.id)-(a.id===me.id)), ph=phase(), admin=isAdmin(me);
  const g=SECRETS.find(x=>x.min===ph);
  return `<div class="banner reveal">${PHASE_INFO[ph-1].banner}</div>
  ${state.hide?'':`<div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;"><div><div class="eyebrow">GUEST LIST</div><h3>${ps.length} guests aboard</h3></div><button class="pick-btn" data-a="hideintro" title="Hide">✕</button></div><div class="subject-role" style="margin:0;">Tap a guest to see their profile or tap the icon in the top right corner to access and edit your profile!</div></div>`}
  ${ps.map(p=>{
    const open=state.open[p.id], self=p.id===me.id, show=open||(self&&ph>=2&&ph<=4), t=trk(p.id), v=state.rd[p.id]||'', s=p.secrets||{};
    const sub=[p.title,p.realName].filter(Boolean).map(esc).join(' · ');
    let body='';
    if(show){
      body=`<div class="board-body">
        ${p.system?`<label class="row-label">System</label><div>${esc(p.system)}</div>`:''}
        ${p.abilities?`<label class="row-label">Abilities</label><div>${nl(p.abilities)}</div>`:''}
        ${!p.system&&!p.abilities?'<div class="subject-role">No public details yet.</div>':''}`;
      if(self&&g) body+=`<label class="row-label" style="margin-top:14px;">${g.label}</label>${g.f.map(([k,l])=>`<p style="margin:4px 0;"><b>${l}:</b> ${s[k]?nl(s[k]):'<span class="subject-role">not filled in yet</span>'}</p>`).join('')}`;
      if(!self&&ph>=2){
        body+=`<label class="row-label" style="margin-top:14px;">Your case file on this guest (private)</label>
        <div class="flags tight">${[['motive','Motive'],['ability','Ability'],['opportunity','Opportunity']].map(([f,l])=>`<button class="tristate ${triCls(t[f])}" data-a="tri" data-id="${p.id}" data-f="${f}">${l} ${triSym(t[f])}</button>`).join('')}</div>`;
        if(ph>=5) body+=`<label class="row-label">Shared alibi with</label><select data-i="shared" data-id="${p.id}"><option value="">None</option>${ps.filter(o=>o.id!==p.id).map(o=>`<option value="${o.id}" ${t.shared===o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select>`;
        body+=`<label class="row-label">Your read</label><div class="pick-actions"><button class="pick-btn ${v==='suspect'?'on-suspect':''}" data-a="gread" data-id="${p.id}" data-val="suspect">Suspicious</button><button class="pick-btn ${v==='innocent'?'on-innocent':''}" data-a="gread" data-id="${p.id}" data-val="innocent">Innocent</button></div>
        <label class="row-label">Your notes</label><textarea data-i="pnote" data-id="${p.id}" placeholder="Notes on ${esc(p.name)}...">${esc(state.pn[p.id]||'')}</textarea>`;
      }
      if(admin&&open){
        body+=`<div class="setup-note"><div class="eyebrow">ADMIN</div><label class="row-label">Character name</label><input type="text" maxlength="40" data-i="afield" data-k="${p.id}|name" value="${esc(p.name)}"><label class="row-label">Role/Position</label><input type="text" maxlength="60" data-i="afield" data-k="${p.id}|title" value="${esc(p.title)}">${SECRETS.map(g=>g.f.map(([k,l])=>`<label class="row-label">${l}</label><textarea data-i="secret" data-k="${p.id}|${k}">${esc(s[k]||'')}</textarea>`).join('')).join('')}
        <label class="row-label">Personal notes</label><textarea data-i="anote" data-id="${p.id}">${esc(p.notes||'')}</textarea></div>`;
      }
      body+='</div>';
    }
    return `<div class="board-card"><div class="board-header" data-a="open" data-id="${p.id}">
      <div class="avatar-wrap"><div class="avatar ${v==='suspect'?'avatar-suspect':v==='innocent'?'avatar-innocent':''}">${av(p)}</div></div>
      <div style="flex:1;min-width:0;"><div class="subject-name">${esc(p.name||'Unnamed')}${self?' <span class="mono" style="color:var(--amber);font-size:.7rem;">(YOU)</span>':''}${admin&&!p.owner?' <span class="mono" style="color:var(--dim);font-size:.7rem;">(unclaimed)</span>':''}</div><div class="subject-role">${sub||'&nbsp;'}</div></div>
      ${!self&&OBJ[ph]?`<button class="tristate ${triCls(t[OBJ[ph]])}" data-a="tri" data-id="${p.id}" data-f="${OBJ[ph]}" style="margin-right:6px;flex:none;">${OBJ[ph][0].toUpperCase()+OBJ[ph].slice(1)} ${triSym(t[OBJ[ph]])}</button>`:''}${admin&&!self?`<button class="pick-btn" data-a="take" data-id="${p.id}" title="Take over this guest" style="margin-right:6px;">✓</button><button class="pick-btn" data-a="kick" data-id="${p.id}" title="${p.owner?'Remove access':'Delete'}">✕</button>`:''}
      <span class="chevron">${self&&ph>=2&&ph<=4&&!admin?'':open?'▲':'▼'}</span></div>${body}</div>`;
  }).join('')}
  ${admin?'<button class="btn secondary" data-a="new">+ New player</button>':''}
  ${isSO(me)?phaseButtons():''}`;
}
function profile(me){
  const ph=phase(), s=me.secrets||{};
  const ed=editing;
  const fld=(id,l,v,ta)=>`<label class="row-label">${l}</label>${ta?`<textarea id="${id}">${esc(v)}</textarea>`:`<input type="text" id="${id}" maxlength="60" value="${esc(v)}">`}`;
  let h=`${state.hideInfo?'':`<div class="banner" style="display:flex;justify-content:space-between;gap:10px;"><span>Please fill out the immigration form and upload a biometric image.</span><button class="pick-btn" data-a="hideinfo" title="Hide">✕</button></div>`}<div class="panel"><div style="display:flex;gap:14px;align-items:center;">
    <div class="avatar" data-a="photo" style="width:84px;height:84px;min-width:84px;font-size:1.4rem;cursor:pointer;" title="Tap to change photo">${av(me)}</div>
    <div style="flex:1;min-width:0;">${ed?'':`<h3 style="color:var(--text);">${esc(me.name)}</h3><div class="subject-role" style="margin:0;">${[me.title,me.realName].filter(Boolean).map(esc).join(' · ')}</div>`}<div class="mono" style="font-size:.68rem;color:var(--dim);margin-top:4px;">Tap the picture to upload a photo</div></div>
    ${ed?'':'<button class="btn secondary" data-a="edit">Edit</button>'}</div>
    <input type="file" id="photoIn" accept="image/*" style="display:none">
    ${ed?`${fld('f_name','Character name',me.name)}${fld('f_real','Real name',me.realName)}${fld('f_title','Role/Position',me.title)}${fld('f_sys','System (home planet or system)',me.system)}${fld('f_abil','Abilities',me.abilities,1)}
    <div style="display:flex;gap:10px;margin-top:12px;"><button class="btn" data-a="save">Save</button><button class="btn secondary" data-a="cancel">Cancel</button></div>`
    :`${me.system?`<label class="row-label">System</label><div>${esc(me.system)}</div>`:''}${me.abilities?`<label class="row-label">Abilities</label><div>${nl(me.abilities)}</div>`:''}`}
  </div>`;
  SECRETS.forEach(g=>{ if(ph>=g.min) h+=`<div class="panel reveal"><div class="eyebrow">${g.label}</div>${g.f.map(([k,l])=>`<p><b>${l}:</b> ${s[k]?nl(s[k]):'<span class="subject-role">not filled in yet</span>'}</p>`).join('')}</div>`; });
  h+=`<div class="panel"><div class="eyebrow">PERSONAL NOTES</div><div class="subject-role">Hidden from other guests. The admin can read them.</div><textarea data-i="notes" style="min-height:120px;">${esc(me.notes||'')}</textarea></div>`;
  if(me.saved&&!ed) h+='<button class="btn secondary" data-a="back" style="margin-top:6px;">Back to Guestlist</button>';
  return h;
}
function verdict(me){
  const ps=P(), mv=me.votes||{}, sus=ps.filter(p=>mv[p.id]==='suspect').length;
    return `<div class="banner reveal">${PHASE_INFO[5].banner}</div>
  <div class="panel"><div class="eyebrow mono">${sus}/2 SELECTED AS SUSPECT</div><div class="setup-note">${ps.filter(p=>p.votes&&Object.values(p.votes).some(Boolean)).length} of ${ps.length} guests have voted.</div>${sus>2?'<p style="color:var(--danger);font-size:.85rem;">You can only accuse two. Remove one.</p>':''}</div>
  <div class="pick-grid">${ps.map(p=>`<div class="pick-row"><div><div class="subject-name" style="font-size:.9rem;">${esc(p.name)}</div><div class="subject-role" style="font-size:.72rem;margin:0;">${esc(p.title)}</div></div>
    <div class="pick-actions"><button class="pick-btn ${mv[p.id]==='suspect'?'on-suspect':''}" data-a="vote" data-id="${p.id}" data-val="suspect">Suspect</button><button class="pick-btn ${mv[p.id]==='innocent'?'on-innocent':''}" data-a="vote" data-id="${p.id}" data-val="innocent">Innocent</button></div></div>`).join('')}</div>`;
}
function results(){
  const ps=P(), cnt=(id,v)=>ps.filter(q=>q.votes&&q.votes[id]===v).length;
  const rows=ps.map(p=>({p,a:cnt(p.id,'suspect'),c:cnt(p.id,'innocent')})).sort((x,y)=>y.a-x.a||y.c-x.c||String(x.p.name).localeCompare(String(y.p.name)));
  const max=Math.max(1,...rows.map(r=>r.a));
  return `<div class="banner reveal">Final votes, sorted by accusations. Results update live.</div>
  <div class="pick-grid">${rows.map((r,i)=>`<div class="pick-row" style="flex-direction:column;align-items:stretch;gap:6px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;"><div style="display:flex;gap:10px;align-items:center;"><div class="avatar" style="width:34px;height:34px;min-width:34px;font-size:.8rem;">${av(r.p)}</div><div><div class="subject-name" style="margin:0;">${i+1}. ${esc(r.p.name)}</div><div class="subject-role" style="margin:0;font-size:.72rem;">${esc(r.p.title)}</div></div></div><div class="mono" style="color:var(--danger);font-size:1.1rem;">${r.a}</div></div>
    <div style="height:4px;background:var(--panel);"><div style="height:100%;width:${r.a/max*100}%;background:var(--danger);"></div></div>
    <div class="subject-role" style="margin:0;font-size:.72rem;">${r.a} accuse · ${r.c} cleared</div></div>`).join('')}</div>`;
}
function render(){
  const app=$('#app');
  if(!loaded){ renderTop(null); app.innerHTML='<div class="panel"><div class="eyebrow">CONNECTING</div><p>Loading station records...</p></div>'; return; }
  if(location.hash==='#verdict'){ renderTop(null); app.innerHTML=results(); return; }
  const me=mine();
  renderTop(me);
  if(!me){ app.innerHTML=signup(); return; }
  let t=state.tab; if((t===1||t===2)&&phase()<6) t=0;
  app.innerHTML = t===3?profile(me):t===2?results():t===1?verdict(me):guests(me);
}

const tm={};
function commit(t){
  const d=t.dataset, me=mine(); if(!me) return;
  if(d.i==='notes') upd(me.id,{notes:t.value});
  else if(d.i==='anote') upd(d.id,{notes:t.value});
  else if(d.i==='afield'){ const [id,k]=d.k.split('|'); upd(id,{[k]:t.value.trim()}); }
  else if(d.i==='secret'){ const [id,k]=d.k.split('|'); upd(id,{secrets:{[k]:t.value}}); }
  else if(d.i==='pnote'){ state.pn[d.id]=t.value; save(); }
  else if(d.i==='shared'){ state.trk[d.id]=Object.assign(trk(d.id),{shared:t.value}); save(); }
}
const app=$('#app');
app.addEventListener('input',e=>{ const t=e.target; if(!t.dataset.i) return; const k=t.dataset.i+(t.dataset.k||t.dataset.id||''); clearTimeout(tm[k]); tm[k]=setTimeout(()=>commit(t),600); });
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.i){ commit(t); return; }
  if(t.id==='photoIn'&&t.files[0]){ const me=mine(); shrink(t.files[0]).then(d=>{ upd(me.id,{photo:d}); render(); }).catch(()=>{}); }
});
app.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]'); if(!t) return;
  const d=t.dataset, me=mine();
  switch(d.a){
    case 'signup': { const n=$('#su_name').value.trim(); if(!n){ $('#su_name').focus(); return; } upd(newId(),blank({owner:myUid,name:n,realName:$('#su_real').value.trim()})); state.tab=3; editing=true; save(); break; }
    case 'claim': if(peers[d.id]&&!peers[d.id].owner) upd(d.id,{owner:myUid}); break;
    case 'open': state.open[d.id]=!state.open[d.id]; save(); break;
    case 'hideintro': state.hide=true; save(); break;
    case 'hideinfo': state.hideInfo=true; save(); break;
    case 'back': state.tab=0; editing=false; save(); window.scrollTo(0,0); break;
    case 'togsec': state.secOpen=!state.secOpen; save(); break;
    case 'take': { if(!peers[d.id]||!isAdmin(me)||d.id===me.id) break;
      if(confirm('Take over '+(peers[d.id].name||'this guest')+'? Your current profile will be released. The new profile gets the title "admin".')){
        upd(d.id,{owner:myUid,title:'admin'});
        upd(me.id,{owner:'',title:norm(me.title)==='admin'?'':me.title});
        state.tab=0;
      }
      break; }
    case 'tri': { const c=trk(d.id); state.trk[d.id]=Object.assign(c,{[d.f]:nextTri(c[d.f])}); save(); break; }
    case 'gread': state.rd[d.id]=state.rd[d.id]===d.val?'':d.val; save(); break;
    case 'vote': upd(me.id,{votes:{[d.id]:(me.votes||{})[d.id]===d.val?'':d.val}}); break;
    case 'new': if(isAdmin(me)){ upd(newId(),blank({name:'New player'})); } break;
    case 'kick': { const p=peers[d.id]; if(!p||!isAdmin(me)) break;
      if(p.owner){ if(confirm('Remove access for '+(p.name||'this guest')+'? The profile stays and can be claimed again.')) upd(d.id,{owner:''}); }
      else if(confirm('Delete the unclaimed profile "'+(p.name||'')+'"?')){ delete peers[d.id]; if(db) db.doc('players/'+d.id).delete().catch(()=>{}); }
      break; }
    case 'next': if(isSO(me)) setPhase(phase()+1); return;
    case 'prev': if(isSO(me)) setPhase(phase()-1); return;
    case 'edit': editing=true; break;
    case 'cancel': editing=false; break;
    case 'save': upd(me.id,{name:$('#f_name').value.trim()||me.name,realName:$('#f_real').value.trim(),title:$('#f_title').value.trim(),system:$('#f_sys').value.trim(),abilities:$('#f_abil').value.trim(),saved:true}); editing=false; if(!me.saved){ state.tab=0; save(); window.scrollTo(0,0); } break;
    case 'photo': $('#photoIn').click(); return;
  }
  render();
});
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]'), mb=e.target.closest('#meBtn');
  if(tb&&!tb.disabled){ state.tab=parseInt(tb.dataset.tab); editing=false; save(); render(); }
  else if(mb){ state.tab=state.tab===3?0:3; editing=false; save(); render(); }
});

(function(){ try{
  if(!window.firebase){ app.innerHTML='<div class="panel"><p>Cannot reach Firebase. Check your internet connection.</p></div>'; return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  myUid = store.get('uid', null);
  if(!myUid){ myUid = 'u'+Math.random().toString(36).slice(2)+Date.now().toString(36); store.set('uid', myUid); }
  render();
  db.collection('players').onSnapshot(s=>{
    peers={}; s.docs.forEach(x=>{ peers[x.id]=x.data()||{}; });
    loaded=true;
    const a=document.activeElement;
    if(editing||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))) dirty=true; else render();
  }, ()=>{});
}catch(e){} })();
window.addEventListener('hashchange',render);
document.addEventListener('focusout',()=>{ if(dirty&&!editing){ dirty=false; setTimeout(render,50); } });
</script>
</body>
</html>
