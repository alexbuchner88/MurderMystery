<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Derelict Signal — Investigation Terminal Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0E1A; --panel:#141928; --panel2:#1B2136; --border:#3A4258;
  --amber:#FFA94D; --blue:#5AC8E8; --text:#E8E6E0; --dim:#8A91A8; --danger:#E8615A;
  --ok:#6FCF97;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
html,body{height:100%;margin:0;}
body{
  background:var(--bg); color:var(--text);
  font-family:'Space Grotesk',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:'Space Grotesk',sans-serif; font-weight:700; margin:0 0 8px;}
.mono{font-family:'JetBrains Mono',monospace;}
.topbar{
  position:sticky; top:0; z-index:10;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  background:linear-gradient(var(--bg),var(--bg) 85%,transparent);
  border-bottom:1px solid var(--border);
}
.topbar-row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}
.title{font-size:1.05rem; letter-spacing:0.3px;}
.phase-chip{font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--amber); border:1px solid var(--amber); padding:4px 10px; white-space:nowrap;}
.btn{
  font-family:'Space Grotesk',sans-serif; font-weight:500; font-size:0.9rem;
  background:var(--amber); color:#1A1200; border:none; padding:10px 16px;
  cursor:pointer;
}
.btn:active{transform:translateY(1px);}
.btn.secondary{background:transparent; color:var(--blue); border:1px solid var(--blue);}
.btn.danger{background:transparent; color:var(--danger); border:1px solid var(--danger);}
.btn:disabled{opacity:0.35; cursor:not-allowed;}
.tabs{display:flex; gap:4px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
.tab{
  font-family:'JetBrains Mono',monospace; font-size:0.78rem; color:var(--dim);
  background:var(--panel); border:1px solid var(--border); padding:8px 12px;
  cursor:pointer; white-space:nowrap;
}
.tab.active{color:var(--bg); background:var(--blue); border-color:var(--blue);}
main{max-width:640px; margin:0 auto; padding:16px 16px 60px;}
.panel{background:var(--panel); border:1px solid var(--border); padding:16px; margin-bottom:14px;}
.panel h3{font-size:0.95rem; color:var(--amber);}
.eyebrow{font-family:'JetBrains Mono',monospace; font-size:0.72rem; color:var(--dim); margin-bottom:4px;}
.subject-card{
  background:var(--panel2); border:1px solid var(--border); padding:12px; margin-bottom:10px;
  display:flex; gap:12px; align-items:flex-start;
}
.avatar{
  width:44px; height:44px; min-width:44px; border-radius:50%;
  background:var(--panel); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-weight:600; color:var(--blue); font-size:1rem;
}
.subject-body{flex:1; min-width:0;}
.subject-name{font-weight:700; margin-bottom:2px;}
.subject-role{font-size:0.8rem; color:var(--dim); margin-bottom:8px;}
.flags{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:8px;}
.flag{display:flex; align-items:center; gap:6px; font-size:0.8rem; cursor:pointer; user-select:none;}
.flag input{width:16px; height:16px; accent-color:var(--amber);}
select, textarea, input[type=text]{
  width:100%; background:var(--panel); color:var(--text); border:1px solid var(--border);
  padding:8px; font-family:'Space Grotesk',sans-serif; font-size:0.85rem; margin-top:4px;
}
textarea{min-height:60px; resize:vertical;}
.row-label{font-size:0.75rem; color:var(--dim); margin-top:8px; display:block;}
.notes-toggle{font-size:0.78rem; color:var(--blue); background:none; border:none; cursor:pointer; padding:4px 0; text-decoration:underline;}
.banner{
  border-left:3px solid var(--amber); padding:10px 12px; background:var(--panel2);
  font-size:0.88rem; margin-bottom:14px; line-height:1.5;
}
.empty{color:var(--dim); font-size:0.88rem; text-align:center; padding:30px 10px;}
.reveal{animation:flicker 0.5s ease-out;}
@keyframes flicker{
  0%{opacity:0.2;} 15%{opacity:0.8;} 30%{opacity:0.15;} 50%{opacity:1;} 100%{opacity:1;}
}
.pick-grid{display:grid; gap:8px;}
.pick-row{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--panel2); border:1px solid var(--border); padding:10px 12px;
}
.pick-actions{display:flex; gap:6px;}
.pick-btn{
  font-family:'JetBrains Mono',monospace; font-size:0.72rem; padding:6px 10px;
  background:transparent; border:1px solid var(--border); color:var(--dim); cursor:pointer;
}
.pick-btn.on-suspect{background:var(--danger); border-color:var(--danger); color:#1A0505;}
.pick-btn.on-innocent{background:var(--ok); border-color:var(--ok); color:#062412;}
.board-card{background:var(--panel2); border:1px solid var(--border); padding:10px; margin-bottom:8px;}
.board-header{display:flex; align-items:center; gap:8px; cursor:pointer;}
.avatar-wrap{position:relative;}
.avatar-wrap .avatar{width:38px; height:38px; min-width:38px; font-size:0.85rem;}
.avatar.avatar-suspect{border:2px solid var(--danger);}
.avatar.avatar-innocent{border:2px solid var(--ok);}
.badge{
  position:absolute; top:-4px; right:-4px; width:16px; height:16px; border-radius:50%;
  background:var(--bg); border:1px solid var(--border); font-size:0.62rem; font-weight:700;
  display:flex; align-items:center; justify-content:center;
}
.badge.badge-suspect{color:var(--danger); border-color:var(--danger);}
.badge.badge-innocent{color:var(--ok); border-color:var(--ok);}
.board-header .subject-name{margin-bottom:0;}
.board-header .subject-role{margin-bottom:0;}
.chevron{color:var(--dim); font-size:0.8rem; padding-left:6px;}
.board-body{margin-top:8px; padding-left:0;}
.flags.tight{gap:6px; margin-bottom:6px; flex-wrap:nowrap;}
.tristate{
  font-family:'JetBrains Mono',monospace; font-size:0.68rem; padding:5px 6px; flex:1;
  background:transparent; border:1px solid var(--border); color:var(--dim); cursor:pointer; text-align:center;
}
.tristate.ts-yes{border-color:var(--danger); color:var(--danger);}
.tristate.ts-no{border-color:var(--ok); color:var(--ok);}
.setup-note{font-size:0.78rem; color:var(--dim); border:1px dashed var(--border); padding:10px; margin-top:10px;}
.avatar{overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
::-webkit-scrollbar{height:6px; width:6px;}
::-webkit-scrollbar-thumb{background:var(--border);}
@media (max-width:400px){ .title{font-size:0.95rem;} }
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-row">
    <div class="title">🛰️ DERELICT SIGNAL</div>
    <div class="phase-chip mono" id="phaseChip">PHASE 1/6</div>
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<main id="app"></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* ============================================================
   EDIT YOUR SUBJECTS HERE before the party.
   Fill in each field between the quotation marks.
   - id: leave as-is (s1, s2, s3...)
   - name: character's name
   - role: their job/title on the station (shown under their name)
   - motiveAccuse: the rumour THIS person spreads accusing someone else
   - motiveExonerate: the rumour THIS person spreads clearing someone else
   - weaponConnect: the clue THIS person has connecting someone to the weapon
   - weaponDisprove: the clue THIS person has disproving a weapon connection
   - alibiLocation: where THIS person says they were at the time of murder
   - alibiProof: "none", "object" (physical proof), or "witness" (another subject vouches)
   - alibiWitness: if alibiProof is "witness", the name of who vouches for them
   Add or remove whole { ... } blocks to change the guest count (15-20 recommended).
============================================================ */
const SUBJECTS = [
  {id:"s1", name:"Capt. Rhea Solari", role:"Station Commander", motiveAccuse:"Claims Tomas Ilkay argued with the victim over reactor budget cuts.", motiveExonerate:"Insists Naila Bourdin was nowhere near the cargo bay all shift.", weaponConnect:"Found a coolant wrench, station-issue, missing from Engineering's rack.", weaponDisprove:"That wrench was logged out to three crew members, not just one.", alibiLocation:"Bridge, running the evening systems check", alibiProof:"object", alibiWitness:""},
  {id:"s2", name:"Dr. Emory Vance", role:"Chief Medical Officer", motiveAccuse:"Overheard Corvin Ashworth threaten to \"end this deal one way or another.\"", motiveExonerate:"Confirms Selin Marsh was in the infirmary being treated for a burn.", weaponConnect:"Recognizes tool marks matching a scalpel from the medbay kit.", weaponDisprove:"That scalpel was inventoried and accounted for at shift's end.", alibiLocation:"Medbay, treating a minor injury", alibiProof:"witness", alibiWitness:"Selin Marsh"},
  {id:"s3", name:"Tomas Ilkay", role:"Engineering Chief", motiveAccuse:"Believes Capt. Rhea Solari wanted the victim gone before the audit.", motiveExonerate:"Says Yuki Tanabe couldn't have left the hangar, the shuttle was mid-repair.", weaponConnect:"Traces a fingerprint smudge on the coolant wrench to cargo-deck gloves.", weaponDisprove:"Those gloves are standard issue, worn by half the crew.", alibiLocation:"Engineering bay, reactor coolant flush", alibiProof:"object", alibiWitness:""},
  {id:"s4", name:"Naila Bourdin", role:"Cargo Master", motiveAccuse:"Claims Prof. Liang Wu was furious about a mislabeled specimen crate.", motiveExonerate:"Vouches that Ens. Dax Okafor was on patrol, not near cargo.", weaponConnect:"Noticed the coolant wrench missing from a supply manifest two days early.", weaponDisprove:"Manifest errors like that happen weekly, proves nothing.", alibiLocation:"Cargo bay, reconciling manifests", alibiProof:"none", alibiWitness:""},
  {id:"s5", name:"Ens. Dax Okafor", role:"Security Officer", motiveAccuse:"Reports Dr. Emory Vance falsified a medical requisition.", motiveExonerate:"Confirms Capt. Rhea Solari's bridge logs check out.", weaponConnect:"Footage shows someone matching Tomas Ilkay's build near Engineering.", weaponDisprove:"The footage timestamp doesn't match the estimated time of death.", alibiLocation:"Patrol route, decks B through D", alibiProof:"witness", alibiWitness:"Naila Bourdin"},
  {id:"s6", name:"Prof. Liang Wu", role:"Xenobiologist", motiveAccuse:"Suspects Yuki Tanabe smuggled something aboard for the victim.", motiveExonerate:"Says Corvin Ashworth was arguing on comms the whole time, not moving.", weaponConnect:"Identifies unusual residue on the wrench matching lab reagents.", weaponDisprove:"That reagent is used station-wide for cleaning, not just in the lab.", alibiLocation:"Xenobiology lab, cataloguing samples", alibiProof:"none", alibiWitness:""},
  {id:"s7", name:"Corvin Ashworth", role:"Diplomatic Envoy", motiveAccuse:"Claims Naila Bourdin owed the victim a serious debt.", motiveExonerate:"Confirms Prof. Liang Wu never left the lab all evening.", weaponConnect:"Noticed the wrench was gone when he passed Engineering earlier.", weaponDisprove:"He wasn't authorized near Engineering, so his account may be false.", alibiLocation:"Comms room, negotiating with a passing freighter", alibiProof:"object", alibiWitness:""},
  {id:"s8", name:"Yuki Tanabe", role:"Pilot", motiveAccuse:"Says Ens. Dax Okafor held an old grudge against the victim.", motiveExonerate:"Backs up Dr. Emory Vance's medbay story completely.", weaponConnect:"Saw someone drop something into the recycler near Engineering.", weaponDisprove:"It was too dark to identify who it was.", alibiLocation:"Hangar bay, mid-repair on the shuttle", alibiProof:"witness", alibiWitness:"Tomas Ilkay"},
  {id:"s9", name:"Selin Marsh", role:"Communications Officer", motiveAccuse:"Believes Capt. Rhea Solari silenced the victim's complaint on purpose.", motiveExonerate:"Confirms Ens. Dax Okafor's patrol logs line up perfectly.", weaponConnect:"Intercepted a private message about \"getting rid of the wrench.\"", weaponDisprove:"That message was sent hours after the murder, too late to matter.", alibiLocation:"Infirmary, treated for a minor burn", alibiProof:"witness", alibiWitness:"Dr. Emory Vance"},
];

/* PLACEHOLDER abilities per subject: [name, kind]. Replace with the real ones later. */
const ABILITIES = {
  s1:[["Mind Alteration","supernatural"],["Tactical Command","natural"]],
  s2:[["Empathic Sensing","supernatural"],["Field Medicine","natural"]],
  s3:[["Engineering","natural"],["Telekinesis","supernatural"]],
  s4:[["Hacking","natural"],["Precognition","supernatural"]],
  s5:[["Combat Reflexes","natural"],["Mind Alteration","supernatural"]],
  s6:[["Xenolinguistics","natural"],["Telepathy","supernatural"]],
  s7:[["Persuasion","natural"],["Mind Alteration","supernatural"]],
  s8:[["Piloting","natural"],["Phasing","supernatural"]],
  s9:[["Hacking","natural"],["Telepathy","supernatural"]]
};

const PHASE_INFO = [
  {title:"ARRIVAL", banner:"Welcome aboard the derelict station. Review the dossier below — these are everyone present tonight."},
  {title:"THE MURDER", banner:"A body has been found. Two rumours are now circulating from each subject: one accusing, one exonerating. Trade them with the room."},
  {title:"THE WEAPON", banner:"The murder weapon has been identified. Each subject holds a clue — one connecting a person to the weapon, one disproving a connection."},
  {title:"TIME & PLACE", banner:"The time and place of the murder are confirmed. Check alibis — some are proven, some rest only on another subject's word."},
  {title:"THE ACCOMPLICE", banner:"No single subject has motive, weapon connection, and alibi gap together. Find the PAIR who between them satisfy all three."},
  {title:"THE VERDICT", banner:"Cast your votes. Choose up to two suspects to accuse, or mark subjects as certainly innocent."},
];

/* FIREBASE CONFIG: Firestore must be created in your Firebase project. */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBXngpFJJQaQ31XvyVZQ1gvXYbsoXnVJ58",
  authDomain: "example-app-6ecf5.firebaseapp.com",
  projectId: "example-app-6ecf5",
  storageBucket: "example-app-6ecf5.firebasestorage.app",
  messagingSenderId: "499648887891",
  appId: "1:499648887891:web:1c75271271df39f5b81aa6"
};

const TABS = ["Dossier","My Profile","Investigation Board","Verdict"];
const store = {
  get(k,d){ try{const v=localStorage.getItem('mm_'+k); return v?JSON.parse(v):d;}catch(e){return d;} },
  set(k,v){ try{localStorage.setItem('mm_'+k, JSON.stringify(v));}catch(e){} }
};

let state = {
  phase: store.get('phase', 1),
  myId: store.get('myId', null),
  tab: store.get('tab', 0),
  track: store.get('track', {}),      // {subjectId: {motive:'unknown'|'yes'|'no', weapon:..., alibi:..., connectTo:""}}
  notes: store.get('notes', {}),      // {subjectId: "text"}
  votes: store.get('votes', {}),
  read: store.get('read', {}),
  me: store.get('me', {realName:'', photo:''}),      // {subjectId: "suspect"|"innocent"}
  collapse: store.get('collapse', {}) // {subjectId: bool} true = collapsed
};

function save(){
  store.set('phase', state.phase);
  store.set('myId', state.myId);
  store.set('tab', state.tab);
  store.set('track', state.track);
  store.set('notes', state.notes);
  store.set('votes', state.votes);
  store.set('read', state.read);
  store.set('me', state.me);
  store.set('collapse', state.collapse);
}
function getTrack(id){ return state.track[id] || {motive:'unknown', weapon:'unknown', alibi:'unknown', connectTo:""}; }
function setTrack(id, patch){ state.track[id] = Object.assign(getTrack(id), patch); save(); }
function initials(name){ return name.trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase(); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let db=null, myUid=null, peers={}, pushT=null, dirty=false, armed=false;
const okImg=p=>typeof p==='string'&&p.startsWith('data:image/jpeg;base64,')&&p.length<60000;
function claimants(sid){ const out=[]; if(state.myId===sid) out.push(state.me); Object.keys(peers).forEach(id=>{ const p=peers[id]; if(id!==myUid&&p&&p.subjectId===sid) out.push(p); }); return out; }
function avatarInner(sid,name){ const c=claimants(sid).find(p=>okImg(p.photo)); return c?`<img src="${c.photo}" alt="">`:esc(initials(name)); }
function playedBy(sid){ return claimants(sid).map(p=>esc(p.realName)).filter(Boolean).join(', '); }
function pushMe(){ if(!db||!myUid) return; clearTimeout(pushT); pushT=setTimeout(()=>{ db.doc('players/'+myUid).set({subjectId:state.myId||'',realName:state.me.realName||'',photo:state.me.photo||'',votes:state.votes}).catch(()=>{}); },400); }
function playerCount(){ return Object.keys(peers).filter(id=>peers[id]&&peers[id].subjectId).length; }
function tallyText(sid){ if(!db) return ''; let a=0; Object.keys(peers).forEach(id=>{ if(id!==myUid&&peers[id].votes&&peers[id].votes[sid]==='suspect') a++; }); if(state.votes[sid]==='suspect') a++; return ` · ${a} accuse`; }
function shrink(file){ return new Promise((ok,no)=>{ const r=new FileReader(); r.onerror=no; r.onload=()=>{ const im=new Image(); im.onerror=no; im.onload=()=>{ const n=128,c=document.createElement('canvas'); c.width=c.height=n; const s=Math.min(im.width,im.height); c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,n,n); ok(c.toDataURL('image/jpeg',0.75)); }; im.src=r.result; }; r.readAsDataURL(file); }); }
function nextTri(v){ return v==='unknown' ? 'yes' : v==='yes' ? 'no' : 'unknown'; }
function triSymbol(v){ return v==='yes' ? '✓' : v==='no' ? '✕' : '–'; }
function triClass(v){ return v==='yes' ? 'ts-yes' : v==='no' ? 'ts-no' : ''; }

function unlockedTabs(){
  // Dossier always; Profile once chosen self; Board from phase 2; Verdict from phase 6
  const u = [true, !!state.myId, state.phase>=2, state.phase>=6];
  return u;
}

function renderTopbar(){
  document.getElementById('phaseChip').textContent = `PHASE ${state.phase}/6 — ${PHASE_INFO[state.phase-1].title}`;
  const u = unlockedTabs();
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = TABS.map((t,i)=>
    `<button class="tab ${state.tab===i?'active':''}" ${u[i]?'':'disabled style="opacity:.3;cursor:not-allowed"'} data-tab="${i}">${t}</button>`
  ).join('');
  tabsEl.querySelectorAll('.tab').forEach(b=>{
    b.addEventListener('click', ()=>{ state.tab = parseInt(b.dataset.tab); save(); render(); });
  });
}

function phaseButtons(){
  const atStart = state.phase<=1;
  const atEnd = state.phase>=6;
  return `<div style="display:flex; gap:10px; margin-top:6px;">
    <button class="btn secondary" id="prevPhaseBtn" ${atStart?'disabled':''}>← Back</button>
    <button class="btn" id="nextPhaseBtn" ${atEnd?'disabled':''}>${atEnd?'Investigation Closed':'Next Phase →'}</button>
  </div>`;
}

function renderDossier(){
  return `
    <div class="banner reveal">${PHASE_INFO[state.phase-1].banner}</div>
    <div class="panel">
      <div class="eyebrow">GUEST LIST</div>
      <h3>All Subjects Aboard</h3>
      <div class="setup-note">${state.myId?'You are signed up. To switch character, use Change Profile in My Profile.':'Tap your character to sign up. You can only do this once.'}</div>
    </div>
    ${SUBJECTS.map(s=>`
      <div class="subject-card" ${!state.myId&&!claimants(s.id).length?`data-pick="${s.id}" style="cursor:pointer;"`:''}>
        <div class="avatar">${avatarInner(s.id,s.name)}</div>
        <div class="subject-body">
          <div class="subject-name">${s.name}${state.myId===s.id?' <span class="mono" style="color:var(--amber);font-size:.7rem;">(YOU)</span>':''}${!state.myId&&claimants(s.id).length?' <span class="mono" style="color:var(--dim);font-size:.7rem;">(taken)</span>':''}</div>${playedBy(s.id)?`<div class="mono" style="font-size:.72rem;color:var(--blue);margin-bottom:2px;">${playedBy(s.id)}</div>`:''}
          <div class="subject-role">${s.role}</div>
        </div>
      </div>
    `).join('')}
    ${phaseButtons()}
  `;
}

function renderProfile(){
  if(!state.myId){
    return `<div class="panel"><div class="eyebrow">SETUP</div><h3>Who are you?</h3>
      <div class="setup-note">Open the Dossier tab and tap your character's name to begin.</div></div>`;
  }
  const me = SUBJECTS.find(s=>s.id===state.myId);
  let html = `<div class="panel">
    <div class="eyebrow">YOUR IDENTITY</div>
    <h3>${me.name}</h3>
    <div class="subject-role">${me.role}</div>
    <button class="btn ${armed?'danger':'secondary'}" id="changeIdBtn" style="margin-top:8px;">${armed?'Tap again to release this character':'Change Profile'}</button>
  </div>`;

  html += `<div class="panel">
    <div class="eyebrow">PLAYER</div>
    <div style="display:flex;gap:12px;align-items:center;">
      <div class="avatar" style="width:64px;height:64px;min-width:64px;">${avatarInner(me.id,me.name)}</div>
      <div style="flex:1;min-width:0;">
        <label class="row-label" style="margin-top:0;">Your real name</label>
        <input type="text" id="realName" maxlength="40" value="${esc(state.me.realName)}" placeholder="So the others know who you are">
      </div>
    </div>
    <input type="file" id="photoIn" accept="image/*" style="display:none">
    <button class="btn secondary" id="photoBtn" style="margin-top:10px;">${state.me.photo?'Change photo':'Upload photo'}</button>
    <div class="setup-note">${db?'Synced with the other players.':'Offline mode. Name and photo stay on this device.'}</div>
  </div>
  <div class="panel">
    <div class="eyebrow">YOUR ABILITIES</div>
    ${(ABILITIES[me.id]||[]).map(a=>`<p><b>${esc(a[0])}</b> <span class="mono" style="color:var(--dim);font-size:.72rem;">${esc(a[1])}</span></p>`).join('')||'<p class="setup-note">None assigned.</p>'}
  </div>`;
  if(state.phase>=2){
    html += `<div class="panel reveal">
      <div class="eyebrow">YOUR RUMOURS</div>
      <p><b>Accusing:</b> ${me.motiveAccuse||'<span class="setup-note" style="display:inline">not filled in yet</span>'}</p>
      <p><b>Exonerating:</b> ${me.motiveExonerate||'<span class="setup-note" style="display:inline">not filled in yet</span>'}</p>
    </div>`;
  }
  if(state.phase>=3){
    html += `<div class="panel reveal">
      <div class="eyebrow">YOUR WEAPON CLUES</div>
      <p><b>Connects someone:</b> ${me.weaponConnect||'—'}</p>
      <p><b>Disproves a connection:</b> ${me.weaponDisprove||'—'}</p>
    </div>`;
  }
  if(state.phase>=4){
    const proofLabel = me.alibiProof==='object' ? 'Physical proof' : me.alibiProof==='witness' ? `Vouched for by ${me.alibiWitness||'(unset)'}` : 'No proof';
    html += `<div class="panel reveal">
      <div class="eyebrow">YOUR ALIBI</div>
      <p><b>Location:</b> ${me.alibiLocation||'—'}</p>
      <p><b>Proof:</b> ${proofLabel}</p>
    </div>`;
  }
  return html;
}

function renderBoard(){
  const others = SUBJECTS;
  return `
    <div class="banner reveal">${PHASE_INFO[state.phase-1].banner}</div>
    <div class="pick-grid">
    ${others.map(s=>{
      const t = getTrack(s.id);
      const v = state.read[s.id]||'';
      const notesOpen = state.notes['_open_'+s.id];
      const collapsed = !!state.collapse[s.id];
      const avatarCls = v==='suspect' ? 'avatar-suspect' : v==='innocent' ? 'avatar-innocent' : '';
      const badge = v==='suspect' ? `<span class="badge badge-suspect">!</span>` : v==='innocent' ? `<span class="badge badge-innocent">✓</span>` : '';
      return `
      <div class="board-card">
        <div class="board-header" data-collapse-toggle="${s.id}">
          <div class="avatar-wrap">
            <div class="avatar ${avatarCls}">${avatarInner(s.id,s.name)}</div>
            ${badge}
          </div>
          <div class="subject-body">
            <div class="subject-name">${s.name}</div>
            ${collapsed?'':`<div class="subject-role">${s.role}</div>`}
          </div>
          <span class="chevron">${collapsed?'▸':'▾'}</span>
        </div>
        ${collapsed?'':`
        <div class="board-body">
          <div class="flags tight">
            <button class="tristate ${triClass(t.motive)}" data-tristate="${s.id}" data-field="motive">Motive ${triSymbol(t.motive)}</button>
            ${state.phase>=3?`<button class="tristate ${triClass(t.weapon)}" data-tristate="${s.id}" data-field="weapon">Weapon ${triSymbol(t.weapon)}</button>`:''}
            ${state.phase>=4?`<button class="tristate ${triClass(t.alibi)}" data-tristate="${s.id}" data-field="alibi">Alibi ${triSymbol(t.alibi)}</button>`:''}
          </div>
          ${state.phase>=5?`
            <label class="row-label">Connected to (shared alibi / accomplice)</label>
            <select data-connect="${s.id}">
              <option value="">— none —</option>
              ${others.filter(o=>o.id!==s.id).map(o=>`<option value="${o.id}" ${t.connectTo===o.id?'selected':''}>${o.name}</option>`).join('')}
            </select>
          `:''}
          <label class="row-label">Your read on this subject</label>
          <div class="pick-actions" style="margin-top:4px;">
            <button class="pick-btn ${v==='suspect'?'on-suspect':''}" data-vote="${s.id}" data-val="suspect">Suspicious</button>
            <button class="pick-btn ${v==='innocent'?'on-innocent':''}" data-vote="${s.id}" data-val="innocent">Innocent</button>
          </div>
          <button class="notes-toggle" data-notes-toggle="${s.id}">${notesOpen?'Hide notes':'Notes'}</button>
          ${notesOpen?`<textarea data-notes="${s.id}" placeholder="Your notes on ${s.name}...">${state.notes[s.id]||''}</textarea>`:''}
        </div>`}
      </div>`;
    }).join('')}
    </div>
    ${phaseButtons()}
  `;
}

function renderVerdict(){
  const suspects = SUBJECTS.filter(s=>state.votes[s.id]==='suspect');
  return `
    <div class="banner reveal">${PHASE_INFO[5].banner}</div>
    <div class="panel">
      <div class="eyebrow mono">${suspects.length}/2 SELECTED AS SUSPECT</div>
      <div class="setup-note">${db?`${playerCount()} players synced. Votes update live.`:'Offline mode. Only your own votes are counted.'}</div>
      ${suspects.length>2?'<p style="color:var(--danger);font-size:.85rem;">You can only accuse two. Remove one.</p>':''}
    </div>
    <div class="pick-grid">
    ${SUBJECTS.map(s=>{
      const v = state.votes[s.id]||'';
      return `<div class="pick-row">
        <div>
          <div class="subject-name" style="font-size:.9rem;">${s.name}</div>
          <div class="subject-role" style="font-size:.72rem;">${s.role}${tallyText(s.id)}</div>
        </div>
        <div class="pick-actions">
          <button class="pick-btn ${v==='suspect'?'on-suspect':''}" data-vote="${s.id}" data-val="suspect">Suspect</button>
          <button class="pick-btn ${v==='innocent'?'on-innocent':''}" data-vote="${s.id}" data-val="innocent">Innocent</button>
        </div>
      </div>`;
    }).join('')}
    </div>
  `;
}

function render(){
  renderTopbar();
  const app = document.getElementById('app');
  const u = unlockedTabs();
  let tab = state.tab;
  if(!u[tab]) tab = 0;
  if(tab===0) app.innerHTML = renderDossier();
  else if(tab===1) app.innerHTML = renderProfile();
  else if(tab===2) app.innerHTML = renderBoard();
  else app.innerHTML = renderVerdict();
  bindEvents(tab);
}

function bindEvents(tab){
  const nextBtn = document.getElementById('nextPhaseBtn');
  if(nextBtn) nextBtn.addEventListener('click', ()=>{
    if(state.phase<6){ state.phase++; save(); render(); window.scrollTo(0,0); }
  });
  const prevBtn = document.getElementById('prevPhaseBtn');
  if(prevBtn) prevBtn.addEventListener('click', ()=>{
    if(state.phase>1){ state.phase--; save(); render(); window.scrollTo(0,0); }
  });
  document.querySelectorAll('[data-vote]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.vote, val = el.dataset.val;
      const bag = tab===2 ? state.read : state.votes; bag[id] = bag[id]===val ? '' : val; if(tab!==2) pushMe();
      save(); render();
    });
  });
  if(tab===0){
    document.querySelectorAll('[data-pick]').forEach(el=>{
      el.addEventListener('click', ()=>{
        if(state.myId||claimants(el.dataset.pick).length) return; state.myId = el.dataset.pick; state.tab = 1; save(); pushMe(); render();
      });
    });
  }
  if(tab===1){
    const rn = document.getElementById('realName');
    if(rn) rn.addEventListener('change', ()=>{ state.me.realName = rn.value.trim(); save(); pushMe(); });
    const pb = document.getElementById('photoBtn'), pi = document.getElementById('photoIn');
    if(pb && pi){
      pb.addEventListener('click', ()=>pi.click());
      pi.addEventListener('change', ()=>{ const f = pi.files[0]; if(f) shrink(f).then(d=>{ state.me.photo = d; save(); pushMe(); render(); }).catch(()=>{}); });
    }
    const ch = document.getElementById('changeIdBtn');
    if(ch) ch.addEventListener('click', ()=>{
      if(!armed){
        armed = true; render();
        setTimeout(()=>{ if(armed){ armed = false; if(!/INPUT/.test(document.activeElement.tagName)) render(); } }, 4000);
        return;
      }
      armed = false; state.myId = null; state.tab = 0; save(); pushMe(); render();
    });
  }
  if(tab===2){
    document.querySelectorAll('[data-collapse-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.dataset.collapseToggle;
        state.collapse[id] = !state.collapse[id];
        save(); render();
      });
    });
    document.querySelectorAll('[data-tristate]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const id = el.dataset.tristate, field = el.dataset.field;
        setTrack(id, {[field]: nextTri(getTrack(id)[field])});
        render();
      });
    });
    document.querySelectorAll('[data-connect]').forEach(el=>{
      el.addEventListener('click', ev=>ev.stopPropagation());
      el.addEventListener('change', ()=>{
        setTrack(el.dataset.connect, {connectTo: el.value});
      });
    });
    document.querySelectorAll('[data-notes-toggle]').forEach(el=>{
      el.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        const id = el.dataset.notesToggle;
        state.notes['_open_'+id] = !state.notes['_open_'+id];
        save(); render();
      });
    });
    document.querySelectorAll('[data-notes]').forEach(el=>{
      el.addEventListener('click', ev=>ev.stopPropagation());
      el.addEventListener('input', ()=>{
        state.notes[el.dataset.notes] = el.value; save();
      });
    });
  }
}

render();

(function(){ try{
  if(!window.firebase) return;
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  myUid = store.get('uid', null);
  if(!myUid){ myUid = 'p' + Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('uid', myUid); }
  db.collection('players').onSnapshot(s=>{
    peers = {}; s.docs.forEach(x=>{ peers[x.id] = x.data() || {}; });
    const a = document.activeElement;
    if(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) dirty = true; else render();
  }, ()=>{});
  pushMe(); render();
}catch(e){} })();
document.addEventListener('focusout', ()=>{ if(dirty){ dirty = false; setTimeout(render, 50); } });
</script>
</body>
</html>
